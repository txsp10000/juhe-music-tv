workflows:
  android-build:
    name: Android TV Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      java: "17"
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Build Android APK
        script: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Locate APK
        script: |
          echo "=== Searching for APK files ==="
          find . -name "*.apk" -type f 2>/dev/null
          echo "=== Listing debug output dir ==="
          ls -la app/build/outputs/apk/debug/ 2>/dev/null || echo "Directory not found"
    artifacts:
      - app/build/outputs/apk/debug/*.apk
