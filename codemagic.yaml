workflows:
  android-build:
    name: Android TV Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      java: "17"
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Build Android APK
        script: |
          chmod +x gradlew
          ./gradlew assembleRelease
    artifacts:
      - app/build/outputs/apk/release/*.apk
